<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Writer Web - AI Smart Whiteboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.35);
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- TOP HEADER HUD -->
  <header class="h-16 bg-[#111218]/90 backdrop-blur-md border-b border-gray-800 flex items-center justify-between px-6 z-20">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
      <h1 class="text-xl font-bold tracking-wider text-white">AIR WRITER <span class="text-xs px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">WEB AI</span></h1>
    </div>

    <!-- TOOLBAR CONTROLS -->
    <div class="flex items-center space-x-4">
      <!-- Brush Selector -->
      <div class="flex items-center space-x-1 bg-gray-900/80 p-1 rounded-lg border border-gray-800">
        <button id="btn-brush-neon" class="px-3 py-1 text-xs font-semibold rounded bg-cyan-500 text-black transition">Neon</button>
        <button id="btn-brush-calligraphy" class="px-3 py-1 text-xs font-semibold rounded text-gray-400 hover:text-white transition">Calligraphy</button>
        <button id="btn-brush-rainbow" class="px-3 py-1 text-xs font-semibold rounded text-gray-400 hover:text-white transition">Rainbow</button>
        <button id="btn-brush-highlighter" class="px-3 py-1 text-xs font-semibold rounded text-gray-400 hover:text-white transition">Highlighter</button>
      </div>

      <!-- Color Palette -->
      <div class="flex items-center space-x-2 bg-gray-900/80 p-1.5 rounded-lg border border-gray-800">
        <button class="color-btn w-6 h-6 rounded-full bg-[#00f0ff] ring-2 ring-white transition" data-color="#00f0ff"></button>
        <button class="color-btn w-6 h-6 rounded-full bg-[#00ff80] hover:ring-2 hover:ring-white transition" data-color="#00ff80"></button>
        <button class="color-btn w-6 h-6 rounded-full bg-[#ffe600] hover:ring-2 hover:ring-white transition" data-color="#ffe600"></button>
        <button class="color-btn w-6 h-6 rounded-full bg-[#ff3399] hover:ring-2 hover:ring-white transition" data-color="#ff3399"></button>
        <button class="color-btn w-6 h-6 rounded-full bg-[#ffffff] hover:ring-2 hover:ring-white transition" data-color="#ffffff"></button>
      </div>

      <!-- Background Mode -->
      <div class="flex items-center space-x-1 bg-gray-900/80 p-1 rounded-lg border border-gray-800">
        <button id="btn-bg-cam" class="px-3 py-1 text-xs font-medium rounded bg-gray-800 text-white transition">Camera</button>
        <button id="btn-bg-white" class="px-3 py-1 text-xs font-medium rounded text-gray-400 hover:text-white transition">Whiteboard</button>
        <button id="btn-bg-dark" class="px-3 py-1 text-xs font-medium rounded text-gray-400 hover:text-white transition">Dark Grid</button>
      </div>

      <!-- Actions -->
      <button id="btn-undo" class="px-3 py-1.5 text-xs font-semibold rounded bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 transition flex items-center space-x-1">
        <span>↩️ Undo</span>
      </button>
      <button id="btn-clear" class="px-3 py-1.5 text-xs font-semibold rounded bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800 transition">
        Clear
      </button>
      <button id="btn-snapshot" class="px-3 py-1.5 text-xs font-bold rounded bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg transition">
        📸 Snapshot
      </button>
    </div>

    <!-- GESTURE STATUS BADGE -->
    <div id="gesture-badge" class="px-3 py-1 text-xs font-bold rounded border border-cyan-500/40 bg-cyan-950/40 text-cyan-300 tracking-wide">
      WAITING FOR HAND
    </div>
  </header>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
    <!-- Hidden webcam video element -->
    <video id="webcam" class="hidden" playsinline></video>

    <!-- Background Layer (Camera or Whiteboard Canvas) -->
    <canvas id="bg-canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>

    <!-- Digital Ink Layer -->
    <canvas id="ink-canvas" class="absolute inset-0 w-full h-full object-cover pointer-events-none"></canvas>

    <!-- Real-time HUD / Skeleton Layer -->
    <canvas id="hud-canvas" class="absolute inset-0 w-full h-full object-cover pointer-events-none"></canvas>

    <!-- FLOATING TOAST -->
    <div id="toast" class="absolute top-8 px-6 py-2 rounded-xl bg-gray-900/90 text-cyan-300 border border-cyan-500/50 shadow-2xl text-sm font-semibold transition-opacity duration-300 opacity-0 pointer-events-none z-30">
      Ready
    </div>
  </main>

  <!-- BOTTOM FOOTER GUIDE -->
  <footer class="h-10 bg-[#0d0e12] border-t border-gray-800 flex items-center justify-between px-6 text-xs text-gray-400 z-20">
    <div class="flex items-center space-x-4">
      <span>☝️ <strong>Index Up:</strong> 1s Countdown to Write</span>
      <span>✌️ <strong>2 Fingers:</strong> Pen Up / Move</span>
      <span>🖐️ <strong>Open Palm:</strong> Sponge Eraser</span>
      <span>👍 <strong>Thumbs Up:</strong> Undo</span>
    </div>
    <div class="text-gray-500">
      MediaPipe JS • React & Next.js Ready Client
    </div>
  </footer>

  <!-- Main JavaScript App -->
  <script src="app.js"></script>
</body>
</html>
